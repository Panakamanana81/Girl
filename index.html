<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fusion 360 - Generatore Esercizi Parametrici</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Generatore di esercizi parametrici per Fusion 360</h1>
        <p>
          Crea tavole con quote da ricreare in sketch su Fusion 360. Scegli la
          difficoltà e genera un nuovo esercizio.
        </p>
      </header>

      <section class="controls">
        <label for="difficulty">Livello di difficoltà</label>
        <select id="difficulty">
          <option value="facile">Facile</option>
          <option value="medio">Medio</option>
          <option value="difficile">Difficile</option>
        </select>

        <button id="generateBtn">Genera esercizio</button>
      </section>

      <section id="exercise" class="exercise" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
